[package]
name = "lightcast"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Local, read-only inventory of the AI services, agents, MCP servers, skills and extensions on this machine."
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
sha2 = "0.10.9"
hex = "0.4.3"
tempfile = "3.27.0"
toml = "0.8.23"
gethostname = "0.4.3"
maxminddb = "0.32.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
