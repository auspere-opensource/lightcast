# Upstream AI providers: how to recognise traffic to them, and where they are headquartered.
#
# hq_country is the provider's headquarters (ISO 3166-1 alpha-2). It is NOT the processing region:
# many providers run regional endpoints and resell through clouds. Cited evidence for each row lives
# in provider_sources.json (source page, quote, regional entities, stated processing countries);
# build_catalog.py merges it, sets the row's status, and fails if a cited country disagrees.
#
# api_hosts match exactly or as a suffix (".example.com" matches "api.example.com").
# regional_hosts are templates with a {region} placeholder; the matched code is looked up in
# cloud_regions.json (cloud: aws | gcp) to give the country where the request is processed.
# region_env lists env names whose VALUE is a region code (read only when it is a known code).
# npm / pypi are SDK packages whose presence in an MCP server's dependency tree means its code can
# call the provider. env_keys are credential names that hand the provider's key to a process.
schema_version: 1
providers:
  - {id: openai,      name: OpenAI,        hq_country: US, status: unverified,
     api_hosts: [api.openai.com, chatgpt.com, oaiusercontent.com],
     npm: [openai, "@ai-sdk/openai", "@langchain/openai"], pypi: [openai, langchain-openai],
     env_keys: [OPENAI_API_KEY], base_url_env: [OPENAI_BASE_URL, OPENAI_API_BASE]}
  - {id: azure_openai, name: Azure OpenAI (Microsoft), hq_country: US, status: unverified,
     api_hosts: [openai.azure.com, cognitiveservices.azure.com, services.ai.azure.com],
     npm: ["@azure/openai", "@ai-sdk/azure"], pypi: [],
     env_keys: [AZURE_OPENAI_API_KEY], base_url_env: [AZURE_OPENAI_ENDPOINT]}
  - {id: anthropic,   name: Anthropic,     hq_country: US, status: unverified,
     api_hosts: [api.anthropic.com, claude.ai],
     npm: ["@anthropic-ai/sdk", "@ai-sdk/anthropic", "@langchain/anthropic", "@anthropic-ai/claude-agent-sdk"], pypi: [anthropic, langchain-anthropic, claude-agent-sdk],
     env_keys: [ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN], base_url_env: [ANTHROPIC_BASE_URL]}
  - {id: aws_bedrock, name: Amazon Bedrock (AWS), hq_country: US, status: unverified,
     api_hosts: [bedrock-runtime.amazonaws.com, bedrock.amazonaws.com],
     npm: ["@aws-sdk/client-bedrock-runtime", "@ai-sdk/amazon-bedrock"], pypi: [langchain-aws],
     env_keys: [AWS_BEARER_TOKEN_BEDROCK], base_url_env: [ANTHROPIC_BEDROCK_BASE_URL],
     cloud: aws, regional_hosts: ["bedrock-runtime.{region}.amazonaws.com", "bedrock-runtime-fips.{region}.amazonaws.com", "bedrock.{region}.amazonaws.com", "bedrock-agent-runtime.{region}.amazonaws.com"],
     region_env: [AWS_REGION, AWS_DEFAULT_REGION]}
  - {id: google,      name: Google Gemini / Vertex AI, hq_country: US, status: unverified,
     api_hosts: [generativelanguage.googleapis.com, aiplatform.googleapis.com, gemini.google.com, notebooklm.google.com, aistudio.google.com],
     npm: ["@google/generative-ai", "@google/genai", "@ai-sdk/google", "@ai-sdk/google-vertex", "@google-cloud/vertexai"], pypi: [google-generativeai, google-genai, google-cloud-aiplatform, langchain-google-genai],
     env_keys: [GEMINI_API_KEY, GOOGLE_GENERATIVE_AI_API_KEY], base_url_env: [ANTHROPIC_VERTEX_BASE_URL],
     cloud: gcp, regional_hosts: ["{region}-aiplatform.googleapis.com", "aiplatform.{region}.rep.googleapis.com"],
     region_env: [CLOUD_ML_REGION, GOOGLE_CLOUD_LOCATION, GOOGLE_CLOUD_REGION, VERTEX_LOCATION]}
  - {id: mistral,     name: Mistral AI,    hq_country: FR, status: unverified,
     api_hosts: [api.mistral.ai, chat.mistral.ai],
     npm: ["@mistralai/mistralai", "@ai-sdk/mistral"], pypi: [mistralai],
     env_keys: [MISTRAL_API_KEY], base_url_env: []}
  - {id: cohere,      name: Cohere,        hq_country: CA, status: unverified,
     api_hosts: [api.cohere.com, api.cohere.ai],
     npm: [cohere-ai, "@ai-sdk/cohere"], pypi: [cohere],
     env_keys: [COHERE_API_KEY], base_url_env: []}
  - {id: deepseek,    name: DeepSeek,      hq_country: CN, status: unverified,
     api_hosts: [api.deepseek.com, chat.deepseek.com],
     npm: ["@ai-sdk/deepseek"], pypi: [],
     env_keys: [DEEPSEEK_API_KEY], base_url_env: []}
  - {id: moonshot,    name: Moonshot AI (Kimi), hq_country: CN, status: unverified,
     api_hosts: [api.moonshot.cn, api.moonshot.ai, kimi.com],
