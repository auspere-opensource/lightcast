  - {id: fireworks,   name: Fireworks AI,  hq_country: US, status: unverified,
     api_hosts: [api.fireworks.ai],
     npm: ["@ai-sdk/fireworks"], pypi: [fireworks-ai], env_keys: [FIREWORKS_API_KEY], base_url_env: []}
  - {id: openrouter,  name: OpenRouter,    hq_country: US, status: unverified,
     api_hosts: [openrouter.ai],
     npm: ["@openrouter/ai-sdk-provider"], pypi: [], env_keys: [OPENROUTER_API_KEY], base_url_env: []}
  - {id: replicate,   name: Replicate,     hq_country: US, status: unverified,
     api_hosts: [api.replicate.com],
