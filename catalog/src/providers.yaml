     npm: [ollama, ollama-ai-provider], pypi: [ollama], env_keys: [], base_url_env: [OLLAMA_HOST]}

# Coding agents and the provider each one uses unless its settings say otherwise.
agent_defaults:
  - {agent: claude_code, command: claude,  provider: anthropic}
  - {agent: codex_cli,   command: codex,   provider: openai}
  - {agent: gemini_cli,  command: gemini,  provider: google}
  - {agent: copilot_cli, command: copilot, provider: github_copilot}
  - {agent: cursor_agent, command: cursor-agent, provider: unknown}

# Settings flags that reroute Claude Code (value read only as true/false).
claude_code_routes:
  - {env: CLAUDE_CODE_USE_BEDROCK, provider: aws_bedrock}
  - {env: CLAUDE_CODE_USE_VERTEX,  provider: google}

# Env names whose VALUE is an endpoint URL; only its host is kept.
endpoint_env_pattern: "(BASE_URL|API_BASE|API_URL|ENDPOINT|_HOST)$"
