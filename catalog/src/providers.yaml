     npm: ["@huggingface/inference"], pypi: [huggingface-hub, huggingface_hub], env_keys: [HF_TOKEN, HUGGINGFACE_API_KEY], base_url_env: []}
  - {id: elevenlabs,  name: ElevenLabs,    hq_country: US, status: unverified,
