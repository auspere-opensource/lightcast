# Hand-authored catalog rows. Every row carries a status; nothing here has been promoted to
# verified yet except where an observation is cited.
schema_version: 1

# Well-known AI command-line tools. A bare executable name on PATH is a name-only match, so the
# harvested cli_command rows are downgraded to low; these curated rows stay medium.
ai_cli:
  - {command: claude,       provider: Anthropic, tool: Claude Code,       agent: true,  status: unverified}
  - {command: codex,        provider: OpenAI,    tool: Codex CLI,         agent: true,  status: unverified}
  - {command: gemini,       provider: Google,    tool: Gemini CLI,        agent: true,  status: unverified}
  - {command: copilot,      provider: GitHub,    tool: Copilot CLI,       agent: true,  status: unverified}
  - {command: cursor-agent, provider: Cursor,    tool: Cursor Agent CLI,  agent: true,  status: unverified}
  - {command: aider,        provider: Aider,     tool: Aider,             agent: true,  status: unverified}
  - {command: goose,        provider: Block,     tool: Goose,             agent: true,  status: unverified}
  - {command: opencode,     provider: SST,       tool: OpenCode,          agent: true,  status: unverified}
  - {command: amp,          provider: Sourcegraph, tool: Amp,             agent: true,  status: unverified}
  - {command: qwen,         provider: Alibaba,   tool: Qwen Code,         agent: true,  status: unverified}
  - {command: crush,        provider: Charm,     tool: Crush,             agent: true,  status: unverified}
  - {command: ollama,       provider: Ollama,    tool: Ollama,            agent: false, status: unverified}
  - {command: lms,          provider: LM Studio, tool: LM Studio CLI,     agent: false, status: unverified}
  - {command: llm,          provider: Simon Willison, tool: llm,          agent: false, status: unverified}

# VS Code-family extension ids (publisher.name, lowercase). "publisher.*" matches any extension of that publisher.
ide_extensions:
  - {id: "anthropic.*",                        provider: Anthropic, tool: Claude extension,  status: measured_present, upstream: anthropic}
  - {id: "openai.*",                           provider: OpenAI,    tool: OpenAI extension,  status: measured_present, upstream: openai}
  - {id: github.copilot,                       provider: GitHub,    tool: GitHub Copilot,    status: unverified, upstream: github_copilot}
  - {id: github.copilot-chat,                  provider: GitHub,    tool: GitHub Copilot Chat, status: unverified, upstream: github_copilot}
  - {id: continue.continue,                    provider: Continue,  tool: Continue,          status: unverified}
  - {id: saoudrizwan.claude-dev,               provider: Cline,     tool: Cline,             status: unverified}
  - {id: rooveterinaryinc.roo-cline,           provider: Roo Code,  tool: Roo Code,          status: unverified}
  - {id: kilocode.kilo-code,                   provider: Kilo Code, tool: Kilo Code,         status: unverified}
  - {id: codeium.codeium,                      provider: Windsurf,  tool: Codeium,           status: unverified}
  - {id: google.geminicodeassist,              provider: Google,    tool: Gemini Code Assist, status: unverified, upstream: google}
  - {id: amazonwebservices.amazon-q-vscode,    provider: AWS,       tool: Amazon Q,          status: unverified}
  - {id: tabnine.tabnine-vscode,               provider: Tabnine,   tool: Tabnine,           status: unverified}
  - {id: sourcegraph.cody-ai,                  provider: Sourcegraph, tool: Cody,            status: unverified}
  - {id: supermaven.supermaven,                provider: Supermaven, tool: Supermaven,       status: unverified}

