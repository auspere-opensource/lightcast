key_names:
  - {name: OPENAI_API_KEY,               provider: OpenAI}
  - {name: AZURE_OPENAI_API_KEY,         provider: Microsoft}
  - {name: ANTHROPIC_API_KEY,            provider: Anthropic}
  - {name: CLAUDE_CODE_OAUTH_TOKEN,      provider: Anthropic}
  - {name: GEMINI_API_KEY,               provider: Google}
  - {name: GOOGLE_GENERATIVE_AI_API_KEY, provider: Google}
  - {name: MISTRAL_API_KEY,              provider: Mistral AI}
  - {name: GROQ_API_KEY,                 provider: Groq}
  - {name: DEEPSEEK_API_KEY,             provider: DeepSeek}
  - {name: XAI_API_KEY,                  provider: xAI}
  - {name: PERPLEXITY_API_KEY,           provider: Perplexity}
  - {name: OPENROUTER_API_KEY,           provider: OpenRouter}
  - {name: COHERE_API_KEY,               provider: Cohere}
  - {name: TOGETHER_API_KEY,             provider: Together AI}
  - {name: FIREWORKS_API_KEY,            provider: Fireworks AI}
  - {name: HF_TOKEN,                     provider: Hugging Face}
  - {name: HUGGINGFACE_API_KEY,          provider: Hugging Face}
  - {name: REPLICATE_API_TOKEN,          provider: Replicate}
  - {name: ELEVENLABS_API_KEY,           provider: ElevenLabs}
  - {name: VOYAGE_API_KEY,               provider: Voyage AI}

# Capability hints for well-known MCP server packages (catalog rows, so they may assign a class).
# upstreams: provider ids (catalog/src/providers.yaml) the package is known to call.
mcp_packages:
  - {package: "@modelcontextprotocol/server-filesystem", capabilities: [fs_write], status: unverified}
  - {package: "@modelcontextprotocol/server-everything",  capabilities: [],         status: unverified}
  - {package: "@modelcontextprotocol/server-puppeteer",   capabilities: [network_egress], status: unverified}
  - {package: "@playwright/mcp",                          capabilities: [network_egress], status: unverified}
  - {package: "chrome-devtools-mcp",                      capabilities: [network_egress], status: unverified}
  - {package: "@wonderwhy-er/desktop-commander",          capabilities: [shell_exec, fs_write], status: unverified}
  - {package: "mcp-server-fetch",                         capabilities: [network_egress], status: unverified}
  - {package: "mcp-server-git",                           capabilities: [fs_write], status: unverified}
  - {package: "elevenlabs-mcp",                           capabilities: [network_egress], upstreams: [elevenlabs], status: unverified}

# Remote MCP hosts operated by the named vendor. A remote server whose host is not here (and not a
# catalogued provider host) is classed remote_unknown.
mcp_remote_hosts:
  - {host: mcp.notion.com,        provider: Notion,    hq_country: US, status: unverified}
  - {host: mcp.linear.app,        provider: Linear,    hq_country: US, status: unverified}
  - {host: mcp.atlassian.com,     provider: Atlassian, hq_country: AU, status: unverified}
  - {host: mcp.sentry.dev,        provider: Sentry,    hq_country: US, status: unverified}
  - {host: mcp.stripe.com,        provider: Stripe,    hq_country: US, status: unverified}
  - {host: api.githubcopilot.com, provider: GitHub,    hq_country: US, status: unverified}

# Commands that are a shell; an MCP server launched as one of these can run arbitrary commands.
shell_commands: [bash, sh, zsh, fish, dash, ksh, pwsh, powershell, cmd]

# Env-var or header NAMES that carry credentials into a server (matched case-insensitively).
credential_name_patterns:
  - "(^|_)(TOKEN|SECRET|PASSWORD|PASSWD|PAT)$"
  - "API_?KEY$"
  - "ACCESS_?KEY(_ID)?$"
  - "PRIVATE_?KEY$"
  - "CREDENTIALS?$"
  - "^AUTHORIZATION$"
  - "^(AWS|GITHUB|GH|GITLAB|AZURE|GOOGLE|GCP|SLACK|STRIPE|DATABASE)_"
  - "_(DSN|CONNECTION_STRING|DATABASE_URL)$"
