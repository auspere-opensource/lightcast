# ADDITIVE candidate seed catalog of named AI destinations, not a replacement for providers.yaml.
# This is a curated STARTING SET, not comprehensive. Review and update it regularly.
# Match describes endpoint identity/website access, NOT proof of an inference request.
# When loaded, merge with original v1 rules; preserve original IDs and dedupe rows.
